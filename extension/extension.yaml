name: custom:com.cc.ext.huawei.campusinsight
version: 0.1.2
minDynatraceVersion: 1.343.0
author:
  name: Core Consulting

python:
  runtime:
    module: custom_huawei_campusinsight
    version:
      min: "3.14"
  activation:
    remote:
      path: activationSchema.json

  featureSets:
    - featureSet: network_telemetry
      metrics:
        - key: custom.huawei.campusinsight.board.cpu.usage
        - key: custom.huawei.campusinsight.board.cpu.usage.max

    - featureSet: network_interface
      metrics:
        - key: custom.huawei.campusinsight.interface.bandwidth.input.usage
        - key: custom.huawei.campusinsight.interface.bandwidth.output.usage
        - key: custom.huawei.campusinsight.interface.packets.send.drop.count
        - key: custom.huawei.campusinsight.interface.packets.receive.drop.count
        - key: custom.huawei.campusinsight.interface.bytes.sent
        - key: custom.huawei.campusinsight.interface.bytes.received

    - featureSet: network_health
      metrics:
        - key: custom.huawei.campusinsight.health.total_rate
        - key: custom.huawei.campusinsight.health.rate
        - key: custom.huawei.campusinsight.health.success_connection
        - key: custom.huawei.campusinsight.health.time_consumption
        - key: custom.huawei.campusinsight.health.roaming
        - key: custom.huawei.campusinsight.health.coverage
        - key: custom.huawei.campusinsight.health.capacity
        - key: custom.huawei.campusinsight.health.throughput

metrics:
  - key: custom.huawei.campusinsight.board.cpu.usage
    metadata:
      displayName: Board CPU Usage
      description: Current CPU usage for Huawei board devices returned by the CampusInsight topn API.
      unit: Percent
      dimensions:
        - key: tenant_id
          displayName: Tenant ID
        - key: device_name
          displayName: Device Name
        - key: device_ip
          displayName: Device IP
        - key: board_id
          displayName: Board ID

  - key: custom.huawei.campusinsight.board.cpu.usage.max
    metadata:
      displayName: Board CPU Usage Maximum
      description: Maximum CPU usage observed for Huawei board devices returned by the CampusInsight topn API.
      unit: Percent
      dimensions:
        - key: tenant_id
          displayName: Tenant ID
        - key: device_name
          displayName: Device Name
        - key: device_ip
          displayName: Device IP
        - key: board_id
          displayName: Board ID

  - key: custom.huawei.campusinsight.interface.bandwidth.input.usage
    metadata:
      displayName: Interface Input Bandwidth Usage
      description: Inbound bandwidth utilization of Huawei device interfaces, returned as meas_value for the input_bandwidth_percent measure of the CampusInsight topn API.
      unit: Percent
      dimensions:
        - key: tenant_id
          displayName: Tenant ID
        - key: device_name
          displayName: Device Name
        - key: device_ip
          displayName: Device IP
        - key: interface_name
          displayName: Interface Name

  - key: custom.huawei.campusinsight.interface.bandwidth.output.usage
    metadata:
      displayName: Interface Output Bandwidth Usage
      description: Outbound bandwidth utilization of Huawei device interfaces, returned as meas_value for the output_bandwidth_percent measure of the CampusInsight topn API.
      unit: Percent
      dimensions:
        - key: tenant_id
          displayName: Tenant ID
        - key: device_name
          displayName: Device Name
        - key: device_ip
          displayName: Device IP
        - key: interface_name
          displayName: Interface Name

  - key: custom.huawei.campusinsight.interface.packets.send.drop.count
    metadata:
      displayName: Interface Send Drop Packets
      description: Number of packets dropped on send for a Huawei device interface, returned as meas_value for the send_drop_pkts_cnt measure of the CampusInsight topn API.
      unit: Count
      dimensions:
        - key: tenant_id
          displayName: Tenant ID
        - key: device_name
          displayName: Device Name
        - key: device_ip
          displayName: Device IP
        - key: interface_name
          displayName: Interface Name

  - key: custom.huawei.campusinsight.interface.packets.receive.drop.count
    metadata:
      displayName: Interface Receive Drop Packets
      description: Number of packets dropped on receive for a Huawei device interface, returned as meas_value for the recv_drop_pkts_cnt measure of the CampusInsight topn API.
      unit: Count
      dimensions:
        - key: tenant_id
          displayName: Tenant ID
        - key: device_name
          displayName: Device Name
        - key: device_ip
          displayName: Device IP
        - key: interface_name
          displayName: Interface Name

  - key: custom.huawei.campusinsight.interface.bytes.sent
    metadata:
      displayName: Interface Bytes Sent
      description: Number of bytes sent by a Huawei device interface, returned as meas_value for the dcn_port_port_send_byte measure of the CampusInsight topn API.
      unit: Byte
      dimensions:
        - key: tenant_id
          displayName: Tenant ID
        - key: device_name
          displayName: Device Name
        - key: device_ip
          displayName: Device IP
        - key: interface_name
          displayName: Interface Name

  - key: custom.huawei.campusinsight.interface.bytes.received
    metadata:
      displayName: Interface Bytes Received
      description: Number of bytes received by a Huawei device interface, returned as meas_value for the dcn_port_port_receive_byte measure of the CampusInsight topn API.
      unit: Byte
      dimensions:
        - key: tenant_id
          displayName: Tenant ID
        - key: device_name
          displayName: Device Name
        - key: device_ip
          displayName: Device IP
        - key: interface_name
          displayName: Interface Name

  - key: custom.huawei.campusinsight.health.total_rate
    metadata:
      displayName: Network Health Total Rate
      description: Overall WLAN network health score for the tenant, aggregated across all health-degree components and returned in the totalRate field by the CampusInsight health API.
      unit: Percent
      dimensions:
        - key: tenant_id
          displayName: Tenant ID

  - key: custom.huawei.campusinsight.health.rate
    metadata:
      displayName: Network Health Rate
      description: Overall network health rate for the tenant, returned in the rate field of the CampusInsight health API. This metric is declared by the extension but is not currently reported by the runtime.
      unit: Percent
      dimensions:
        - key: tenant_id
          displayName: Tenant ID

  - key: custom.huawei.campusinsight.health.success_connection
    metadata:
      displayName: Success Connection Rate
      description: Percentage of successful wireless connection attempts for the tenant, returned in the succesCon field of the CampusInsight health API. This metric is declared by the extension but is not currently reported by the runtime.
      unit: Percent
      dimensions:
        - key: tenant_id
          displayName: Tenant ID

  - key: custom.huawei.campusinsight.health.time_consumption
    metadata:
      displayName: Access Time Consumption
      description: Access time consumption health score for the tenant, returned in the timeCon field of the CampusInsight health API. This metric is declared by the extension but is not currently reported by the runtime.
      unit: Percent
      dimensions:
        - key: tenant_id
          displayName: Tenant ID

  - key: custom.huawei.campusinsight.health.roaming
    metadata:
      displayName: Roaming Health
      description: Wireless client roaming health score for the tenant, returned in the roaming field of the CampusInsight health API. This metric is declared by the extension but is not currently reported by the runtime.
      unit: Percent
      dimensions:
        - key: tenant_id
          displayName: Tenant ID

  - key: custom.huawei.campusinsight.health.coverage
    metadata:
      displayName: Coverage Health
      description: Wireless signal coverage health score for the tenant, returned in the coverage field of the CampusInsight health API.
      unit: Percent
      dimensions:
        - key: tenant_id
          displayName: Tenant ID

  - key: custom.huawei.campusinsight.health.capacity
    metadata:
      displayName: Capacity Health
      description: Network capacity health score for the tenant, returned in the capacity field of the CampusInsight health API.
      unit: Percent
      dimensions:
        - key: tenant_id
          displayName: Tenant ID

  - key: custom.huawei.campusinsight.health.throughput
    metadata:
      displayName: Throughput Health
      description: Network throughput health score for the tenant, returned in the throughput field of the CampusInsight health API.
      unit: Percent
      dimensions:
        - key: tenant_id
          displayName: Tenant ID


topology:
  types:
    - enabled: true
      name: "campusinsight:device"
      displayName: "Huawei CampusInsight Device"
      rules:
        - idPattern: "iMaster_Device_{tenant_id}_{device_name}"
          instanceNamePattern: "{device_name}"
          attributes:
            - key: tenant_id
              displayName: Tenant ID
              pattern: "{tenant_id}"
            - key: device_name
              displayName: Device Name
              pattern: "{device_name}"
            - key: device_ip
              displayName: Device IP
              pattern: "{device_ip}"
          sources:
            - sourceType: Metrics
              condition: $prefix(custom.huawei.campusinsight.board.)

    - enabled: true
      name: "campusinsight:board"
      displayName: "Huawei CampusInsight Board"
      rules:
        - idPattern: "iMaster_Board_{board_id}"
          instanceNamePattern: "{device_name} - {board_id}"
          attributes:
            - key: device_name
              displayName: Device Name
              pattern: "{device_name}"
            - key: device_ip
              displayName: Device IP
              pattern: "{device_ip}"
            - key: board_id
              displayName: Board ID
              pattern: "{board_id}"
          sources:
            - sourceType: Metrics
              condition: $prefix(custom.huawei.campusinsight.board.)
      
    - enabled: true
      name: "campusinsight:tenant"
      displayName: "Huawei CampusInsight Tenant"
      rules:
        - idPattern: "iMaster_Tenant_{tenant_id}"
          instanceNamePattern: "Tenant {tenant_id}"
          attributes:
            - key: tenant_id
              displayName: Tenant ID
              pattern: "{tenant_id}"
          sources:
            - sourceType: Metrics
              condition: $prefix(custom.huawei.campusinsight.health.)

  relationships:
    - fromType: "campusinsight:board"
      toType: "campusinsight:device"
      typeOfRelation: CHILD_OF 
      sources:
        - sourceType: Metrics
          condition: $prefix(custom.huawei.campusinsight.board.)

    - fromType: "campusinsight:device"
      toType: "campusinsight:tenant"
      typeOfRelation: CHILD_OF
      sources:
        - sourceType: Metrics
          condition: $prefix(custom.huawei.campusinsight.board.)
